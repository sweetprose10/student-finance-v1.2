<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Buat Akun | StudentFinance</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="login-page"><section class="login-card"><a class="brand" href="{{ url_for('login') }}"><span class="brand-mark">↗</span> StudentFinance</a><h1>Buat akun baru.</h1><p>Mulai catat pemasukan, pengeluaran, dan target tabunganmu.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form class="login-form" method="POST"><div class="form-field"><label for="username">Username</label><input id="username" name="username" minlength="3" placeholder="Minimal 3 karakter" required autofocus></div><div class="form-field"><label for="password">Password</label><input id="password" type="password" name="password" minlength="5" placeholder="Minimal 5 karakter" required></div><div class="form-field"><label for="confirm">Konfirmasi password</label><input id="confirm" type="password" name="confirm" placeholder="Ulangi password" required></div><button type="submit">Buat akun →</button></form><a class="text-link back-link" href="{{ url_for('login') }}">← Kembali ke halaman masuk</a></section></main></body></html>
