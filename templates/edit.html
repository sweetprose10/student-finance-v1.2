{% extends "base.html" %}
{% block title %}Edit Transaksi | StudentFinance{% endblock %}
{% block content %}<header class="page-heading"><h1>Edit transaksi</h1><p>Perbarui detail transaksi yang dipilih.</p></header><section class="panel form-panel"><form action="{{ url_for('update', id=data[1]) }}" method="POST" class="form-grid"><div class="form-field"><label>Jenis transaksi</label><input value="{{ data[2] }}" disabled></div><div class="form-field"><label for="kategori">Kategori</label><input id="kategori" name="kategori" value="{{ data[3] }}" required></div><div class="form-field"><label for="nominal">Nominal</label><input id="nominal" type="number" name="nominal" min="1" value="{{ data[4] }}" required></div><div class="form-field full"><label for="keterangan">Keterangan</label><input id="keterangan" name="keterangan" value="{{ data[5] or '' }}"></div><div class="form-field full"><div class="actions"><button type="submit">Simpan perubahan</button><a class="btn secondary" href="{{ url_for('dashboard') }}">Batal</a></div></div></form></section>{% endblock %}
