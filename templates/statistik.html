{% extends "base.html" %}
{% block title %}Statistik | StudentFinance{% endblock %}
{% block content %}<header class="page-heading"><h1>Statistik keuangan</h1><p>Lihat perbandingan arus uangmu secara sederhana.</p></header><section class="panel" style="max-width:850px"><div class="panel-heading"><h2>Pemasukan vs pengeluaran</h2></div><canvas id="grafik" height="120"></canvas></section><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>new Chart(document.getElementById('grafik'), { type:'bar', data:{ labels:['Pemasukan','Pengeluaran'], datasets:[{ data:[{{ pemasukan }},{{ pengeluaran }}], backgroundColor:['#188b5a','#d95d39'], borderRadius:6, maxBarThickness:58 }] }, options:{ plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ callback:value => 'Rp ' + new Intl.NumberFormat('id-ID').format(value) } } } } });</script>{% endblock %}
